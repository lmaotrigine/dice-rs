max_width = 120
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
use_small_heuristics = "Max"

# Unstable options that help catching mistakes in formatting and that we want to
# enable when they become stable.
#
# They are kept here since they are useful to run from time to time.
# Stable rustfmt will emit warnings but will not fail.
format_code_in_doc_comments = true
format_strings = true
reorder_impl_items = true
comment_width = 80
wrap_comments = true
normalize_comments = true
